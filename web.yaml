apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-web
  template:
    metadata:
      labels:
        app: gitops-web
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-web
spec:
  selector:
    app: gitops-web
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
